plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	maven { url "https://maven.shedaniel.me/" }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url = "https://api.modrinth.com/maven" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Night Config
	include(implementation("com.electronwill.night-config:core:3.8.3"))
	include(implementation("com.electronwill.night-config:toml:3.8.3"))

	// Mod menu
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Cloth config
	implementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	// Iris Shaders
	implementation "maven.modrinth:YL57xq9U:sZbVsl2Q"

	// Sodium
	implementation "maven.modrinth:AANobbMI:tZQ3jqnf"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {}
}
